# data/quests.yml
deliver_tech:
  name: "Deliver Tech Goods"
  description: "Deliver {amount} units of Tech goods to {destination}"
  type: "delivery"
  rewards:
    money: 5000
    research_points: 50
  requirements:
    commodity: "tech"
    amount: [50, 100]

mine_salt:
  name: "Mine Salt Deposits"
  description: "Mine {amount} units of salt at {location}"
  type: "mining"
  rewards:
    money: 3000
    research_points: 30
  requirements:
    resource_type: "salt"
    amount: [20, 50]

hunt_pirates:
  name: "Hunt Pirates"
  description: "Eliminate {amount} pirate ships in this sector"
  type: "combat"
  rewards:
      money: 7000
      research_points: 70
  requirements:
      enemy_type: "pirate"
      amount: [3, 6]

scan_anomalies:
  name: "Scan Anomalies"
  description: "Scan spatial anomalies near {location}"
  type: "exploration"
  rewards:
      money: 4000
      research_points: 80
  requirements:
    location_type: ["DeepSpaceOutpost", "ResearchColony"]
    amount: [1, 3]

research_advanced_tech:
  name: "Research Advanced Technology"
  description: "Conduct research into new technologies"
  type: "research"
  rewards:
      money: 6000
      research_points: 100
  requirements:
    research_type: "data"
    target_points: [40, 80]