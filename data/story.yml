ch1:
  title: "First Steps"
  description: "Learn the basics of space trading"
  requirements: {}
  milestones:
    - milestone_id: "first_trade"
      title: "First Trade"
      description: "Complete your first trade"
      requirements:
        trades_completed: 1
      rewards:
        money: 500
        plot_points: 5
      story_text: >
          You've taken your first step into the world of space trading.
          A small transaction, but the first of many on this journey.
      alternate_text: >
          The market is unforgiving. Your first transaction was clumsy, but
          you survived it.
      dialogue:
        default: "You have made first steps in commerce."
        alternate: "The market was unforgiving, and you barely made any money."
        market_crash: "You have traded on the market, but there was market crash after you, and you lost money"
        resource_shortage: "Your trade created a resource shortage. Be careful in the future."
    - milestone_id: "first_combat"
      title: "Combat Initiation"
      description: "Win your first space battle"
      requirements:
        combat_victories: 1
      rewards:
        money: 1000
        plot_points: 5
      story_text: >
          You've won your first space battle. The galaxy is not a safe place,
          but you've proven you can defend yourself.
      alternate_text: >
          You were lucky to survive, but you did. It was not your skill, but
          a lucky shot.
      dialogue:
        default: "You won your first battle. You are ready for more."
        alternate: "Your battle was not decisive. You barely managed to survive."
        pirate_attack: "Your first battle was against pirates! Your actions were heroic."
        rogue_corsair: "You fought against the rogue corsairs. You made quick work of them."
    - milestone_id: "basic_license"
      title: "Extended Trading License"
      description: "Prove your trading capabilities"
      requirements:
        trades_completed: 5
        money: 20000
      rewards:
        money: 10000
        plot_points: 10
        items: ["navcomp"]
      story_text: >
        After completing several successful trades, you've proven yourself 
        capable to the local authorities. You've been granted an extended 
        trading license, allowing access to more lucrative markets. This 
        also comes with a free navigation computer, making your journeys
        much easier.
      alternate_text: >
        A basic license was all you could get. You are not special. You are
        just another cog in the machine.
      dialogue:
          default: "You have acquired an extended trading license."
          alternate: "Your trading capabilities impressed no one, so a basic license was all you could get."
  next_chapters: ["ch2a", "ch2b"]

ch2a:
  title: "Trade Empire Rising"
  description: "Build your commercial empire"
  requirements:
    chapters_completed: ["ch1"]
    plot_points: 15
    trades_completed: 10
  milestones:
    - milestone_id: "establish_route"
      title: "Trade Route Network"
      description: "Establish profitable trade routes"
      requirements:
        trades_completed: 20
        buildings_built: {"stockmarket": 2}
      rewards:
        money: 50000
        plot_points: 15
      story_text: >
        You've established a network of trade routes, with several stockmarkets
        to your disposal. Your operations are starting to look like a real business.
      alternate_text: >
        You are making some decent trades, still nothing that would change
        the galaxy.
      dialogue:
          default: "You have established your first trade route network."
          alternate: "Your trading network is very small, nothing significant, just some decent trades."
    - milestone_id: "passenger_business"
      title: "Passenger Services"
      description: "Start passenger transport business"
      requirements:
        passengers_transported: 10
        passenger_reputation: 20
      rewards:
        money: 30000
        plot_points: 10
      story_text: >
        You've started to transport passengers, making your business more
        diversed. You are starting to build a real reputation.
      alternate_text: >
        Some people are willing to pay you to move them from one place to another.
      dialogue:
          default: "You have started the passenger transport business."
          alternate: "There is some interest in your passenger transport business."
  next_chapters: ["ch3a", "ch3c"]
  
ch2b:
  title: "Combat Legend"
  description: "Become a legendary combat pilot"
  requirements:
    chapters_completed: ["ch1"]
    plot_points: 15
    combat_victories: 5
  milestones:
      - milestone_id: "defeat_pirates"
        title: "Pirate Hunter"
        description: "Clear the sector of pirates"
        requirements:
          combat_victories: {"pirate": 10}
        rewards:
          money: 40000
          plot_points: 20
        story_text: >
          You've become a known pirate hunter, making space lanes safer.
        alternate_text: >
          You've eliminated a few small groups of pirates. Nothing to be proud about.
        dialogue:
            default: "You have cleared the sector of pirates."
            alternate: "You managed to defeat some pirates, but this is not significant."
      - milestone_id: "defend_stations"
        title: "Station Defender"
        description: "Successfully defend space stations"
        requirements:
          combat_victories: 15
          buildings_built: {"Neuroengineering Guild": 1}
        rewards:
          money: 30000
          plot_points: 15
        story_text: >
          You've defended several stations from attacks. You're starting to
          be known as a capable protector.
        alternate_text: >
          You've survived a few attacks. It was not skill, but pure luck.
        dialogue:
            default: "You are defending stations in the sector."
            alternate: "You helped defend some stations, but it was not really difficult."
  next_chapters: ["ch3b", "ch3c"]
  
ch3a:
  title: "Economic Dominance"
  description: "Achieve economic control of the sector"
  requirements:
    chapters_completed: ["ch2a"]
    plot_points: 40
    trade_profit: 200000
  milestones:
    - milestone_id: "market_control"
      title: "Market Controller"
      description: "Control multiple market centers"
      requirements:
        buildings_built: {"stockmarket": 4}
        research_unlocked: ["xenoeconomy"]
      rewards:
        money: 100000
        plot_points: 25
      story_text: >
        Your network of stockmarkets and improved trade skills have brought
        you significant economic influence, making you a true market controller.
      alternate_text: >
        You've accumulated some wealth. But your influence is not as strong as
        you might think.
      dialogue:
         default: "You have taken control over the market in this sector."
         alternate: "You've some control over the markets, but it is not absolute yet."
  next_chapters: ["ending_trade"]
  
ch3b:
  title: "Military Might"
  description: "Become the dominant military force"
  requirements:
    chapters_completed: ["ch2b"]
    plot_points: 40
    combat_victories: 25
  milestones:
      - milestone_id: "fleet_commander"
        title: "Fleet Commander"
        description: "Lead successful fleet operations"
        requirements:
          combat_victories: 35
          combat_rating: 15
        rewards:
          money: 100000
          plot_points: 25
        story_text: >
          You've become a fleet commander, leading your forces to victory. Your
          name is now feared in the space lanes.
        alternate_text: >
          You are leading some forces, still nothing that would be a real
          threat to anyone.
        dialogue:
            default: "You have become a fleet commander. Your forces are well trained."
            alternate: "You have some forces under your command, but you are still not the best leader."
  next_chapters: ["ending_combat"]

ch3c:
  title: "Ancient Mysteries"
  description: "Uncover the sector's ancient secrets"
  requirements:
    chapters_completed: ["ch2a", "ch2b"]
    plot_points: 50
    research_points: 300
  milestones:
    - milestone_id: "alien_artifacts"
      title: "Ancient Technology"
      description: "Discover alien artifacts"
      requirements:
          locations_discovered: {"ResearchColony": 2}
          research_unlocked: ["xenoeconomy", "telemetry"]
      rewards:
          money: 150000
          plot_points: 30
      story_text: >
        You've uncovered secrets of ancient civilizations. You are now more than
        a simple trader, you are a seeker of knowledge.
      alternate_text: >
        You've found some shiny objects. They don't seem to be worth much.
      dialogue:
          default: "You have found some ancient artifacts."
          alternate: "You explored some old places, but did not find anything too impressive."
  next_chapters: ["ending_discovery"]

ending_trade:
  title: "Galactic Trade Mogul"
  description: "You've become a legendary trade mogul"
  requirements:
      chapters_completed: ["ch3a"]
      plot_points: 100
      trade_profit: 1000000
  milestones:
    - milestone_id: "trade_ending"
      title: "Economic Victory"
      description: "Complete economic domination achieved"
      requirements:
          buildings_built: {"stockmarket": 5}
          passenger_reputation: 80
          trade_profit: 1000000
      rewards:
        money: 1000000
        plot_points: 100
      story_text: >
        You've become the greatest trade mogul of the sector. Your economic
        empire spans the whole galaxy.
      alternate_text: >
        You've accumulated wealth, but it seems like there is nothing more to do.
      dialogue:
            default: "You are now a Galactic Trade Mogul!"
            alternate: "You became very rich, but it feels like you could do more."
  next_chapters: []

ending_combat:
  title: "Legendary Fleet Admiral"
  description: "You've become a legendary military leader"
  requirements:
      chapters_completed: ["ch3b"]
      plot_points: 100
      combat_victories: 50
  milestones:
      - milestone_id: "combat_ending"
        title: "Military Victory"
        description: "Complete military dominance achieved"
        requirements:
            combat_victories: 75
            combat_rating: 25
        rewards:
            money: 1000000
            plot_points: 100
        story_text: >
          You are now a legend in the space lanes. Your military prowess is
          unmatched, and your name is feared by everyone.
        alternate_text: >
          You've defeated some pirates, but you are not the only one.
          Nothing significant, really.
        dialogue:
            default: "You are now a Legendary Fleet Admiral!"
            alternate: "You led your forces well, and managed to survive."
  next_chapters: []

ending_discovery:
  title: "Ancient Mystery Solver"
  description: "You've uncovered the sector's greatest mysteries"
  requirements:
      chapters_completed: ["ch3c"]
      plot_points: 100
      research_points: 1500
  milestones:
      - milestone_id: "discovery_ending"
        title: "Discovery Victory"
        description: "Ancient mysteries solved"
        requirements:
            research_unlocked: ["xenoeconomy", "telemetry", "geophysics", "chronopolitics"]
            locations_discovered: {"ResearchColony": 3, "AsteroidBase": 2}
        rewards:
            money: 1000000
            plot_points: 100
        story_text: >
          You've solved the ancient mysteries of this sector, and your name
          will be remembered as the greatest researcher who has ever lived.
        alternate_text: >
          You've visited some old places and found some old stuff. Nothing
          interesting, really.
        dialogue:
            default: "You are now a solver of Ancient Mysteries!"
            alternate: "You found some artifacts, but not really anything significant."
  next_chapters: []